[project]
name = "vis-split"
version = "0.1.0"
description = "Visual autosplitter: OBS capture -> color transition detection -> LiveSplit splits"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ocr = ["tesserocr>=2.7"]
gui = [
    "pyside6>=6.11.2",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autosplitter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
reportUnusedCallResult = "none"
