capture:
  fps: 60                          # OBS Common FPS Value of the sidecar stream (60)
  # OBS sidecar output (Recording -> Custom Output (FFmpeg), container mpegts).
  # Pin the sidecar's Output (scaled) Resolution to width x height below,
  # regardless of canvas size (works for both 1920x1080 and 2560x1440 setups).
  # Use --record PATH to simultaneously write a .mkv copy (single ffmpeg process).
  stream_url: "udp://127.0.0.1:9733?pkt_size=1316&loglevel=error"
  width: 1920
  height: 1080

roi:
  # Two equivalent forms, all values normalized 0.0-1.0:
  #
  # 1) origin + size:
  #      x: 0.25
  #      y: 0.25
  #      width: 0.50
  #      height: 0.50
  #
  # 2) corner endpoints (x1,y1) = top-left, (x2,y2) = bottom-right:
  #      x1: 0.25
  #      y1: 0.25
  #      x2: 0.75
  #      y2: 0.75
  x: 0.15
  y: 0.15
  width: 0.40
  height: 0.50

ocr:
  # Level number: white digit(s) at the top-left of the GAME AREA. This ROI is for the
  # BROWSER-WINDOW capture (game embedded in a web page, 1920x1080): the digit is only
  # ~18 px tall at x 285..312, y 162..180 px (two digits reach x~312), ROI = those
  # pixels + ~3 px margin. Measured on a real 7.5 min recording: reads every level 1..15
  # at confidence 93-97 at 1920x1080 and at 640x360 (87/90 frames >= 85), including with
  # 400 kbps NVENC. For a FULLSCREEN game capture (tests/fixtures/example_hud.png) the
  # digit is elsewhere: x=0.105 y=0.0 w=0.05 h=0.055. Keep the ROI tight and covering ALL
  # digits of the highest level (15 -> two digits).
  roi:
    x: 0.1469
    y: 0.1472
    width: 0.0177
    height: 0.0231
  engine:
    psm: 7                     # single line: best confidence for 1-2 digits
    whitelist: "0123456789"
    min_confidence: 60.0
  patterns:
    "^\\s*(\\d+)\\s*$": null   # 1-based level number -> split index
  preprocess:
    threshold: color           # white text on mid-gray; immune to the black bar
    text_color: [255, 255, 255]
    text_tolerance: 70         # ~half the text/background contrast (measured best)
    blur: 0
    scale: 4
  poll_interval_frames: 3
  # DRY RUN: only logs `OCR: screen says …` / `would UNDO …` / `HUD advanced +X.XXs`,
  # `HUD gone after the last split …`, and sends nothing to LiveSplit. Watch those
  # lines over several real runs (genuine levels, deaths, and real finishes) first.
  # To actually undo deaths (the death transition is identical to the level
  # transition) set `mode: undo` AND livesplit.follow_timer: true. NOTE: with
  # apply_to_last_split: true below, `mode: undo` also un-ends a run whose HUD
  # number lingers after a real finish for longer than ~6 s, and there is NO
  # automatic recovery for that case (finish by hand; follow_timer follows it).
  mode: verify_only
  undo:
    # Start Powerless: the HUD number updates 1-2 s after the transition and
    # disappears when the game is finished; the shortest level is longer than
    # the ~4 s undo delay. settle 3.0 s = 1.5x the largest observed HUD lag.
    settle_seconds: 3.0
    post_clear_seconds: 1.0
    confirm_reads: 3
    confirm_seconds: 1.0
    window_seconds: 10.0
    min_confidence: 85         # misreads under compression can reach ~80
    require_baseline: true
    baseline_seconds: 2.0
    apply_to_last_split: true  # HUD vanishes on a real finish => a lingering HUD means a death
    last_split_extra_settle_seconds: 2.0   # extra delay on the last split (no recovery)

detection:
  # Debounce is frame-counted (60 fps stream). A DEATH and a level completion fire the same
  # dark wipe, but the wipe is longer for a completion. Measured on 8 real recordings (3 days;
  # 86 completions incl. finishes, 23 deaths), frames at 60 fps with the match threshold 0.75:
  #   completions 17-21 frames, deaths 11-12 frames, start gate 17-18 frames.
  # required_frames 15 sits between them (3 above the longest death, 2 below the shortest
  # completion), so deaths never fire a split. Every split AND the start gate therefore use
  # threshold 0.75 (at the old 0.90 the two overlap). Splits fire ~0.2 s later than before
  # (constant offset). On a 120 fps stream double required_frames (30).
  required_frames: 15
  reset_threshold: 0.70
  # --loop only: after DONE, rearm once the NEXT run's first split color
  # stays below reset_threshold for this many seconds.
  restart_quiet_seconds: 3.0

start_transition:
  # Menu → Level 1 transition (Start Powerless).
  # Detects the fade/load screen when starting a new run.
  # Color: dark gray loading screen ~RGB(22, 13, 18).
  # Tune with: uv run python -m autosplitter.main --config configs/start-powerless.yaml --probe screenshot.png
  name: "Run Start"
  color: transition_color
  threshold: 0.75
  # Optional: auto-start LiveSplit timer when start detected
  auto_start_timer: true

colors:
  # Purple portal flash at level complete (Start Powerless).
  # Estimated from gameplay footage: dominant purple ~RGB(180, 50, 200).
  # Tune with: uv run python -m autosplitter.main --config configs/start-powerless.yaml --probe screenshot.png
  purple_portal:
    rgb: [180, 50, 200]
    tolerance: 30

  # Optional: green arrow powerup pickup flash.
  green_arrow:
    rgb: [50, 200, 50]
    tolerance: 25

  transition_color:
    rgb: [22, 13, 18]
    tolerance: 10



splits:
  # 15 levels: each level ends at purple portal.
  - id: 1
    name: "Level 1"
    color: transition_color
    threshold: 0.75

