livesplit:
  host: "127.0.0.1"
  port: 16834
  # Socket-op budget (bounds a hung-server stall to this many seconds) and
  # the cadence of reconnect attempts while LiveSplit Server is down.
  timeout_seconds: 0.25
  reconnect_seconds: 5.0

record:
  # Path template for recordings. Variables: {game}, {date}, {time},
  # {datetime}, {attempt} (auto-incremented, zero-padded to 4 digits).
  path_template: "recordings/{game}/{datetime}_{attempt:04d}.mkv"
  # Convert .mkv to this format after the run (best-effort, .mkv kept).
  convert_to: "mp4"
  # Keep recording for this many seconds after the last split fires
  # (captures victory screen / final time display).
  post_run_seconds: 30.0
